<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/institutional-ea-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institutional EA</title>
    <script>
      (function() {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-institutional-ea-bg text-institutional-ea-text select-none antialiased overflow-hidden font-sans">
    <div id="root">
      <div
        id="iea-boot-splash"
        style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#091426;color:#F4F7FF;font-family:system-ui,-apple-system,sans-serif;"
      >
        <div style="width:42px;height:42px;border-radius:12px;background:rgba(176,246,72,0.14);border:1px solid rgba(176,246,72,0.45);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#B0F648;">
          IEA
        </div>
        <div style="width:22px;height:22px;border-radius:9999px;border:2px solid rgba(186,214,255,0.2);border-top-color:#B0F648;animation:iea-spin 0.8s linear infinite;"></div>
        <div style="font-size:12px;color:#B6C5E0;letter-spacing:0.02em;">Starting Institutional EA…</div>
        <style>@keyframes iea-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
