<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./institutional-ea-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institutional EA</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('institutional_ea_theme');
          var theme = null;
          if (saved) {
            try {
              var parsed = JSON.parse(saved);
              var data = parsed && typeof parsed === 'object' && 'data' in parsed ? parsed.data : parsed;
              if (data === 'light' || data === 'dark') {
                theme = data;
              }
            } catch (e) {
              if (saved === 'light' || saved === 'dark') {
                theme = saved;
              }
            }
          }
          if (!theme) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-institutional-ea-bg text-institutional-ea-text select-none antialiased overflow-hidden font-sans">
    <div id="root">
      <div
        id="iea-boot-splash"
        style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--iea-bg-canvas,#0A0A0C);color:var(--iea-text-primary,#F3F4F6);font-family:system-ui,-apple-system,sans-serif;"
      >
        <img
          src="./institutional-ea-logo.png"
          alt="Institutional EA"
          style="width:56px;height:56px;border-radius:14px;background:#000000;object-fit:contain;padding:2px;border:1px solid rgba(255,255,255,0.12);"
        />
        <div style="width:22px;height:22px;border-radius:9999px;border:2px solid rgba(59,130,246,0.22);border-top-color:#3B82F6;animation:iea-spin 0.8s linear infinite;"></div>
        <div style="font-size:12px;color:var(--iea-text-secondary,#9CA3AF);letter-spacing:0.01em;">Starting Institutional EA…</div>
        <style>@keyframes iea-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
