<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institutional EA — Recovery</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0E0D0B;
        color: #F5F5F2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        -webkit-app-region: drag;
        background: #12110F;
        border-bottom: 1px solid rgba(255, 255, 253, 0.07);
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 11px;
        font-weight: 600;
        color: #B4B3B0;
        letter-spacing: 0.03em;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: radial-gradient(ellipse 75% 65% at 0% 0%, #2B2A26 0%, #21201D 45%, #1A1917 100%);
        border: 1px solid rgba(240, 113, 120, 0.34);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 253, 0.06);
      }
      h1 { font-size: 17px; font-weight: 600; color: #F5F5F2; margin-bottom: 6px; letter-spacing: -0.015em; }
      .sub { font-size: 12px; color: #B4B3B0; margin-bottom: 16px; line-height: 1.55; }
      .reason {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: #F5B5B9;
        background: #100F0D;
        border: 1px solid rgba(240, 113, 120, 0.28);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 20px;
        word-break: break-word;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        border-radius: 9999px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background-color 0.16s ease, border-color 0.16s ease;
      }
      .btn-primary { background: #F5F5F2; color: #121110; }
      .btn-primary:hover { background: #FFFFFF; }
      .btn-secondary { background: #242320; color: #F5F5F2; border-color: rgba(255, 255, 253, 0.12); }
      .btn-secondary:hover { background: #2B2A26; border-color: #3A3935; }
      .btn-ghost { background: transparent; color: #B4B3B0; border-color: rgba(255, 255, 253, 0.10); }
      .btn-ghost:hover { background: #242320; color: #F5F5F2; }
    </style>
  </head>
  <body>
    <div class="drag-bar">
      <img src="./icon.png" alt="Institutional EA" style="width:18px;height:18px;border-radius:4px;margin-right:8px;object-fit:contain;background:#000;" />
      INSTITUTIONAL EA · RECOVERY
    </div>
    <main class="card" role="alert" data-testid="watchdog-fallback-screen">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <img src="./icon.png" alt="Institutional EA Logo" style="width:40px;height:40px;border-radius:10px;object-fit:contain;background:#000;border:1px solid rgba(255,255,255,0.12);flex-shrink:0;" />
        <h1 style="margin-bottom:0;">Institutional EA did not finish loading</h1>
      </div>
      <p class="sub">
        The interface was safely intercepted before showing a blank window. Your MT5 terminal and DEMO lock remain unaffected.
      </p>
      <div class="reason" id="reason-box">Startup watchdog triggered.</div>
      <div class="actions">
        <button id="btn-reload" class="btn-primary" type="button">Reload</button>
        <button id="btn-reset" class="btn-secondary" type="button">Reset settings</button>
        <button id="btn-logs" class="btn-ghost" type="button">Open logs</button>
      </div>
    </main>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var r = params.get("reason");
          if (r) document.getElementById("reason-box").textContent = r;
        } catch (e) {}

        document.getElementById("btn-reload").addEventListener("click", function () {
          if (window.electronAPI && window.electronAPI.fallbackReload) {
            window.electronAPI.fallbackReload();
          } else {
            window.location.reload();
          }
        });
        document.getElementById("btn-reset").addEventListener("click", function () {
          if (window.electronAPI && window.electronAPI.fallbackResetSettings) {
            window.electronAPI.fallbackResetSettings();
          }
        });
        document.getElementById("btn-logs").addEventListener("click", function () {
          if (window.electronAPI && window.electronAPI.fallbackOpenLogs) {
            window.electronAPI.fallbackOpenLogs();
          }
        });
      })();
    </script>
  </body>
</html>
