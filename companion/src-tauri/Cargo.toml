[package]
name = "institutional_ea_companion"
version = "1.0.0"
description = "Institutional EA Companion Desktop Application"
authors = ["Institutional EA"]
repository = "https://github.com/gackstone/Institutional-EA"
homepage = "https://github.com/gackstone/Institutional-EA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-process = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
