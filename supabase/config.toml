# Institutional EA — Supabase Local & Production Configuration
project_id = "institutional-ea"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
  "institutionalea://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.admin-review-payment]
verify_jwt = true

[functions.admin-manage-subscription]
verify_jwt = true

[functions.device-heartbeat]
verify_jwt = true

# Android claim/poll (pairing code) and mobile-sync GET (iea_ro_* device token)
# do not carry a Supabase user JWT; Windows Companion JWTs are verified explicitly
# inside each Edge Function via requireAuthenticatedUser(req).
[functions.mobile-pairing]
verify_jwt = false

[functions.mobile-sync]
verify_jwt = false
