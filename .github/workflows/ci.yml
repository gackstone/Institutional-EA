name: CI Validation (Branding, Tests & Production Builds)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branding, Typecheck, Tests & Web/Desktop Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for brand asset verification
        run: python -m pip install --upgrade pip pillow

      - name: Validate cross-platform branding assets & version consistency
        run: python scripts/verify-brand-assets.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck Desktop Companion, Web, and Mobile
        run: |
          npm --workspace=companion exec -- tsc --noEmit
          npm --workspace=@institutional-ea/web run typecheck
          npm --workspace=@institutional-ea/mobile run typecheck

      - name: Run full monorepo unit & regression test suite
        run: npm run test:all

      - name: Build production Web & Desktop Companion bundles
        run: |
          npm run build:web
          npm run build:desktop

      - name: Verify branding assets in production dist outputs
        run: python scripts/verify-brand-assets.py --check-builds

      - name: Upload Web production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-production-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error
