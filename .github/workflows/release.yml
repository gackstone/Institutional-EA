name: Release Multi-Platform Builds

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (e.g. v1.3.1)"
        required: false
        default: "v1.3.1"
        type: string
      draft:
        description: "Publish as a Draft release"
        required: false
        default: false
        type: boolean
      run_ios:
        description: "Trigger optional iOS EAS production build (requires EXPO_TOKEN and Apple Developer account)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (Branding, Versions & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Validate branding assets & cross-platform version sync
        run: python scripts/verify-brand-assets.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run full monorepo test suite
        run: npm run test:all

  web:
    name: Web Production Build
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck and build Web production bundle
        run: npm run build:web

      - name: Verify branding assets in Web dist
        run: |
          for f in index.html logo.png favicon.ico favicon-32x32.png apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest; do
            test -s "apps/web/dist/$f" || { echo "Missing apps/web/dist/$f"; exit 1; }
          done

      - name: Package Web release archive & SHA-256
        run: |
          mkdir -p release-out/web
          VERSION=$(node -p "require('./apps/web/package.json').version")
          tar -czf "release-out/web/InstitutionalEA-Web-${VERSION}.tar.gz" -C apps/web/dist .
          HASH=$(sha256sum "release-out/web/InstitutionalEA-Web-${VERSION}.tar.gz" | awk '{print $1}')
          echo "$HASH  InstitutionalEA-Web-${VERSION}.tar.gz" > "release-out/web/InstitutionalEA-Web-${VERSION}.tar.gz.sha256"
          ls -lh release-out/web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-production-build
          path: release-out/web/*
          if-no-files-found: error

  windows:
    name: Windows Installer (.exe)
    needs: [preflight]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck desktop companion
        run: npm --workspace=companion exec -- tsc --noEmit

      - name: Build & verify Windows NSIS installer (safe isolated staging)
        working-directory: companion
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) {
            Write-Warning "WIN_CSC_LINK secret not configured — building UNSIGNED Windows installer."
          }
          npm run dist:win

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-out/windows" | Out-Null
          Copy-Item "companion/release/InstitutionalEA-Setup*.exe*" "release-out/windows/"
          Get-ChildItem "release-out/windows"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-out/windows/*
          if-no-files-found: error

  macos:
    name: macOS Universal Installer (.dmg)
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck desktop companion
        run: npm --workspace=companion exec -- tsc --noEmit

      - name: Ensure resources/bin directory exists
        run: mkdir -p companion/resources/bin

      - name: Build macOS universal DMG (arm64 + x64)
        working-directory: companion
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK secret not configured — building UNSIGNED macOS .dmg (users will need Right-click > Open)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build
          npx electron-builder --mac dmg --universal --publish never

      - name: Verify macOS app bundle & icon.icns inside DMG
        run: |
          DMG_FILE=$(ls companion/release/InstitutionalEA-*.dmg | head -n 1)
          if [ -z "$DMG_FILE" ]; then echo "macOS .dmg not found"; exit 1; fi
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          test -d "$MOUNT_DIR/Institutional EA.app" || { hdiutil detach "$MOUNT_DIR" -force; echo "Missing Institutional EA.app in DMG"; exit 1; }
          test -s "$MOUNT_DIR/Institutional EA.app/Contents/Info.plist" || { hdiutil detach "$MOUNT_DIR" -force; echo "Missing Info.plist"; exit 1; }
          test -s "$MOUNT_DIR/Institutional EA.app/Contents/Resources/icon.icns" || { hdiutil detach "$MOUNT_DIR" -force; echo "Missing icon.icns in app bundle"; exit 1; }
          hdiutil detach "$MOUNT_DIR" -force
          echo "Verified Institutional EA.app bundle and icon.icns inside $DMG_FILE"

      - name: Prepare macOS release assets & SHA-256
        run: |
          mkdir -p release-out/macos
          DMG_FILE=$(ls companion/release/InstitutionalEA-*.dmg | head -n 1)
          BASENAME=$(basename "$DMG_FILE")
          cp "$DMG_FILE" "release-out/macos/$BASENAME"
          cp "$DMG_FILE" "release-out/macos/InstitutionalEA.dmg"
          HASH=$(shasum -a 256 "release-out/macos/InstitutionalEA.dmg" | awk '{print $1}')
          echo "$HASH  InstitutionalEA.dmg" > "release-out/macos/InstitutionalEA.dmg.sha256"
          echo "$HASH  $BASENAME" > "release-out/macos/$BASENAME.sha256"
          ls -lh release-out/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release-out/macos/*
          if-no-files-found: error

  android:
    name: Android APK & AAB (API 24+)
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "::warning::sdkmanager not found; relying on pre-installed Android SDK packages."
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native Android project (minSdk 24)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify generated Android launcher & splash branding resources
        run: |
          find apps/mobile/android/app/src/main/res -name "ic_launcher*" | grep -q . || { echo "Missing Android ic_launcher resources"; exit 1; }
          find apps/mobile/android/app/src/main/res -name "splashscreen*" | grep -q . || { echo "Missing Android splashscreen resources"; exit 1; }
          echo "Verified Android launcher & splash branding resources."

      - name: Configure Android signing (release keystore or debug fallback)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets not configured — generating ephemeral debug keystore so APK is installable on Android 7.0+ (API 24+)."
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore app/debug-fallback.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Institutional EA Debug,O=Institutional EA,C=US"
            echo "RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK & AAB via Gradle
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          if [ "$RELEASE_SIGNING" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleRelease bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/debug-fallback.keystore" \
              -Pandroid.injected.signing.store.password="android" \
              -Pandroid.injected.signing.key.alias="androiddebugkey" \
              -Pandroid.injected.signing.key.password="android"
          fi

      - name: Prepare & verify Android release assets & SHA-256
        run: |
          mkdir -p release-out/android
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          APK_SRC=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find apps/mobile/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK_SRC" ]; then echo "Android APK not found"; exit 1; fi
          unzip -l "$APK_SRC" | grep -q "ic_launcher" || { echo "Launcher icon missing inside built APK"; exit 1; }
          cp "$APK_SRC" "release-out/android/InstitutionalEA-${VERSION}.apk"
          cp "$APK_SRC" "release-out/android/InstitutionalEA.apk"
          APK_HASH=$(sha256sum "release-out/android/InstitutionalEA.apk" | awk '{print $1}')
          echo "$APK_HASH  InstitutionalEA.apk" > "release-out/android/InstitutionalEA.apk.sha256"
          echo "$APK_HASH  InstitutionalEA-${VERSION}.apk" > "release-out/android/InstitutionalEA-${VERSION}.apk.sha256"
          if [ -n "$AAB_SRC" ]; then
            cp "$AAB_SRC" "release-out/android/InstitutionalEA-${VERSION}.aab"
            cp "$AAB_SRC" "release-out/android/InstitutionalEA.aab"
            AAB_HASH=$(sha256sum "release-out/android/InstitutionalEA.aab" | awk '{print $1}')
            echo "$AAB_HASH  InstitutionalEA.aab" > "release-out/android/InstitutionalEA.aab.sha256"
          fi
          ls -lh release-out/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: release-out/android/*
          if-no-files-found: error

  ios:
    name: iOS Prebuild Verification & Optional EAS Build
    needs: [preflight]
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.run_ios == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native iOS project & verify AppIcon / SplashScreen asset catalog
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --non-interactive
          test -d ios/InstitutionalEA/Images.xcassets/AppIcon.appiconset || { echo "Missing iOS AppIcon.appiconset"; exit 1; }
          find ios/InstitutionalEA/Images.xcassets/AppIcon.appiconset -name "*.png" | grep -q . || { echo "Missing PNG in AppIcon.appiconset"; exit 1; }
          test -d ios/InstitutionalEA/Images.xcassets/SplashScreen.imageset || { echo "Missing iOS SplashScreen.imageset"; exit 1; }
          echo "Verified iOS native project, AppIcon.appiconset, and SplashScreen.imageset."

      - name: Check EXPO_TOKEN availability
        id: check_secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret is not configured. Native iOS prebuild & asset catalog were verified, but signed IPA / TestFlight build is skipped until Apple Developer credentials and EXPO_TOKEN are set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo & EAS CLI
        if: steps.check_secret.outputs.enabled == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS iOS production IPA build
        if: steps.check_secret.outputs.enabled == 'true'
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive --no-wait

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, web, windows, android, macos]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.windows.result == 'success' || needs.android.result == 'success' || needs.macos.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download available platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Assemble combined SHA256SUMS.txt & release notes
        env:
          WEB_STATUS: ${{ needs.web.result }}
          WIN_STATUS: ${{ needs.windows.result }}
          MAC_STATUS: ${{ needs.macos.result }}
          AND_STATUS: ${{ needs.android.result }}
        run: |
          cd release-artifacts
          rm -f SHA256SUMS.txt
          for f in InstitutionalEA-Setup.exe InstitutionalEA.dmg InstitutionalEA.apk InstitutionalEA.aab InstitutionalEA-Web-*.tar.gz; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt
          if [ -f "InstitutionalEA.dmg" ]; then
            MAC_LINE="- **macOS (Universal Apple Silicon + Intel):** \`InstitutionalEA.dmg\` *(build: ${MAC_STATUS})*"
          else
            MAC_LINE="- **macOS (Universal Apple Silicon + Intel):** *macOS build coming soon* *(runner status: ${MAC_STATUS})*"
          fi
          cd ..
          cat <<EOF > release-notes.md
          ## Institutional EA Multi-Platform Release

          ### Direct Downloads
          - **Windows (x64 NSIS Installer):** \`InstitutionalEA-Setup.exe\` *(build: ${WIN_STATUS})*
          ${MAC_LINE}
          - **Android (API 24+ / Android 7.0+):** \`InstitutionalEA.apk\` & \`InstitutionalEA.aab\` *(build: ${AND_STATUS})*
          - **Web Production Bundle:** \`InstitutionalEA-Web-*.tar.gz\` *(build: ${WEB_STATUS})*
          - **iOS:** Native asset catalog verified; signed IPA / TestFlight builds run via EAS once Apple Developer Program enrollment & \`EXPO_TOKEN\` are configured.

          ### Security & Read-Only Mobile Guarantee
          - The mobile app is **strictly read-only**: it can never start/stop/pause the bot, place/modify/close orders, or change risk settings.
          - No broker credentials, MT5 logins, or trading API keys are ever sent to or stored on mobile devices.

          ### Install Notes (Unsigned / Debug-Signed Builds)
          - **Windows (SmartScreen):** If Windows Defender SmartScreen shows *"Windows protected your PC"*, click **More info → Run anyway**.
          - **macOS (Gatekeeper):** Drag **Institutional EA** into **Applications**, then **Right-click → Open → Open** on first launch.
          - **Android (Unknown apps):** Tap the APK and allow **Install unknown apps** for your browser when prompted. *(Built with a debug-fallback signature if \`ANDROID_KEYSTORE_*\` secrets are not yet configured.)*

          ### SHA-256 Checksums
          \`\`\`
          $(cat release-artifacts/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Determine release tag and draft mode
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag || 'v1.3.1' }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Institutional EA ${{ steps.meta.outputs.tag }}"
          body_path: release-notes.md
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*
